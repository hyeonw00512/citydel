services:
  - type: web
    runtime: node
    name: citydel-game
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build
    startCommand: corepack pnpm --filter @citadel/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
