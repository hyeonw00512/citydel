services:
  - type: web
    runtime: node
    name: citydel-game
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm run build
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
